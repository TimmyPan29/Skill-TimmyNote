version: "1.0"
author: "TimmyPan29"
description: "Collection of specialized skills for technical writing and note processing"
skills:
  - name: correction-log
    path: ./correction-log
    description: "Extracts and consolidates corrections, errata, and fixes from a conversation thread or transcript into a structured chronological errata log."
    version: "1.0"
    triggers:
      - "summarize what was wrong"
      - "track the fixes"
      - "correction log"
      - "errata"
      - "diff summary"

  - name: data-organizer
    path: ./data-organizer
    description: "Organizes unstructured technical data into hierarchical markdown with strict LaTeX formatting."
    version: "1.1"
    triggers:
      - "organize data"
      - "clean up technical content"
      - "structure markdown"
      - "LaTeX formatting"

  - name: module-organizer
    path: ./module-organizer
    description: "Reorganize and consolidate technical notes by merging identical or related concepts into comparison tables, with intuitive guides and rigorous derivations."
    version: "1.4"
    triggers:
      - "organize notes"
      - "consolidate concepts"
      - "comparison table"
      - "clean this up"
      - "make a study sheet"

  - name: notes-extractor
    path: ./notes-extractor
    description: "Extract substantive content from a transcript paired with handwritten-note image(s), cross-check sources, and emit clean intermediate Markdown."
    version: "1.0"
    triggers:
      - "extract notes"
      - "transcribe handwriting"
      - "process lecture notes"
      - "fuse transcript and notes"
      - "digitize notes"
